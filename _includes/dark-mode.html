<style>
:root { --site-bg-color: #ffffff; }
html, body { background-color: var(--site-bg-color, #ffffff) !important; }

.masthead { overflow: visible; z-index: 1000; }
.masthead__menu { margin-right: 5rem; }
.masthead__controls {
  position: absolute;
  top: 50%;
  right: 0;
  display: flex;
  align-items: center;
  gap: 0.2rem;
  transform: translateY(-50%);
  z-index: 1001;
}
.masthead__controls .masthead-icon-btn,
.masthead__controls .theme-toggle-btn {
  position: static;
  top: auto;
  right: auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.8rem;
  height: 1.8rem;
  padding: 0;
  color: #b5502f;
  background: transparent;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  transform: none;
  z-index: auto;
}
.masthead__controls .masthead-icon-btn:hover,
.masthead__controls .masthead-icon-btn[aria-expanded="true"],
.masthead__controls .theme-toggle-btn:hover {
  background: rgba(181, 80, 47, 0.08);
  color: #883c23;
}
.masthead__controls .masthead-icon-btn:focus,
.masthead__controls .theme-toggle-btn:focus { outline: none; }
.masthead__controls .masthead-icon-btn:focus-visible,
.masthead__controls .theme-toggle-btn:focus-visible { box-shadow: 0 0 0 2px rgba(181, 80, 47, 0.25); }
.color-palette { position: relative; display: inline-flex; }
.color-palette__panel {
  position: absolute;
  top: calc(100% + 0.55rem);
  right: 0;
  display: grid;
  grid-template-columns: repeat(4, 1.55rem);
  gap: 0.45rem;
  padding: 0.55rem;
  background: #fff;
  border: 1px solid #e8e8e8;
  border-radius: 4px;
  box-shadow: 0 6px 18px rgba(0,0,0,.14);
  z-index: 1002;
}
.color-palette__panel[hidden] { display: none; }
.color-palette__swatch {
  width: 1.55rem;
  height: 1.55rem;
  padding: 0;
  background: linear-gradient(135deg, var(--swatch-light) 0 50%, var(--swatch-dark) 50% 100%);
  border: 1px solid rgba(0,0,0,.2);
  border-radius: 50%;
  cursor: pointer;
}
.color-palette__swatch:hover,
.color-palette__swatch.is-active { transform: scale(1.08); }
.color-palette__swatch.is-active,
.color-palette__swatch:focus-visible { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(181, 80, 47, 0.55); }
.color-palette__swatch:focus { outline: none; }

html[data-theme="dark"] { background-color: var(--site-bg-color, #1c1c1e) !important; }
html[data-theme="dark"] body { background-color: var(--site-bg-color, #1c1c1e) !important; color: #f2f2f7; }

html[data-theme="dark"] a { color: #f0916a; }
html[data-theme="dark"] a:visited { color: #d9a488; }
html[data-theme="dark"] a:hover, html[data-theme="dark"] a:active { color: #f7ab8c; }
html[data-theme="dark"] h1, html[data-theme="dark"] h2, html[data-theme="dark"] h3,
html[data-theme="dark"] h4, html[data-theme="dark"] h5, html[data-theme="dark"] h6 { color: #f2f2f7; }
html[data-theme="dark"] hr { border-top-color: #3a3a3c; }
html[data-theme="dark"] blockquote { border-left-color: #48484a; color: #aeaeb2; }
html[data-theme="dark"] figcaption { color: #8e8e93; }

html[data-theme="dark"] p > code, html[data-theme="dark"] a > code,
html[data-theme="dark"] li > code, html[data-theme="dark"] figcaption > code,
html[data-theme="dark"] td > code { background: #2c2c2e; border-color: #48484a; color: #f2a365; }
html[data-theme="dark"] pre { background: #2c2c2e; color: #f2f2f7; }

html[data-theme="dark"] .masthead { background: #2c2c2e !important; border-bottom-color: #3a3a3c; }
html[data-theme="dark"] .greedy-nav { background: #2c2c2e; }
html[data-theme="dark"] .greedy-nav a { color: #aeaeb2; }
html[data-theme="dark"] .greedy-nav a:hover { color: #f2f2f7; }
html[data-theme="dark"] .greedy-nav a:before { background: #f0916a; }
html[data-theme="dark"] .greedy-nav button { background-color: #48484a; }
html[data-theme="dark"] .greedy-nav .hidden-links { background: #2c2c2e; border-color: #3a3a3c; box-shadow: 0 0 10px rgba(0,0,0,.5); }
html[data-theme="dark"] .greedy-nav .hidden-links:before { border-color: #3a3a3c transparent; }
html[data-theme="dark"] .greedy-nav .hidden-links:after { border-color: #2c2c2e transparent; }
html[data-theme="dark"] .greedy-nav .hidden-links a:hover { background: #3a3a3c; color: #f2f2f7; }
html[data-theme="dark"] .greedy-nav .hidden-links li { border-bottom-color: #3a3a3c; }

html[data-theme="dark"] .masthead-icon-btn { color: #aeaeb2; }
html[data-theme="dark"] .masthead-icon-btn:hover,
html[data-theme="dark"] .masthead-icon-btn[aria-expanded="true"] { background: rgba(240, 145, 106, 0.14); color: #f2f2f7; }
html[data-theme="dark"] .masthead-icon-btn:focus-visible { box-shadow: 0 0 0 2px rgba(240, 145, 106, 0.35); }
html[data-theme="dark"] .color-palette__panel { background: #2c2c2e; border-color: #3a3a3c; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
html[data-theme="dark"] .color-palette__swatch { border-color: rgba(255,255,255,.28); }
html[data-theme="dark"] .color-palette__swatch.is-active,
html[data-theme="dark"] .color-palette__swatch:focus-visible { box-shadow: 0 0 0 2px #2c2c2e, 0 0 0 4px rgba(240, 145, 106, 0.65); }

html[data-theme="dark"] .author__name, html[data-theme="dark"] .author__bio { color: #f2f2f7; }
html[data-theme="dark"] .author__urls-wrapper button,
html[data-theme="dark"] .btn--inverse { background-color: #2c2c2e !important; border-color: #48484a !important; color: #aeaeb2 !important; }
html[data-theme="dark"] .author__urls-wrapper button:hover,
html[data-theme="dark"] .btn--inverse:hover { background-color: #3a3a3c !important; color: #f2f2f7 !important; }
html[data-theme="dark"] .author__urls { background: #2c2c2e; border-color: #3a3a3c; }
@media screen and (min-width: 1024px) {
  html[data-theme="dark"] .author__urls { background: transparent; border-color: transparent; box-shadow: none; }
}
html[data-theme="dark"] .author__urls:before { border-color: #3a3a3c transparent; }
html[data-theme="dark"] .author__urls:after { border-color: #2c2c2e transparent; }
html[data-theme="dark"] .author__urls li { border-bottom-color: #3a3a3c; }
html[data-theme="dark"] .author__urls a { color: #aeaeb2; }
html[data-theme="dark"] .author__urls a:hover { color: #f2f2f7; }

html[data-theme="dark"] .page__footer { background-color: #1a1a1a !important; border-top-color: #3a3a3c; color: #8e8e93; }
html[data-theme="dark"] .page__footer a { color: #8e8e93; }
html[data-theme="dark"] .page__footer .fas, html[data-theme="dark"] .page__footer .fab,
html[data-theme="dark"] .page__footer .far, html[data-theme="dark"] .page__footer .fal { color: #8e8e93; }

html[data-theme="dark"] .toc { background-color: #2c2c2e; border-color: #3a3a3c; color: #aeaeb2; }
html[data-theme="dark"] .toc__menu a { color: #aeaeb2; border-bottom-color: #3a3a3c; }
html[data-theme="dark"] .toc__menu a:hover { color: #f2f2f7; background: #3a3a3c; }
html[data-theme="dark"] .nav__sub-title { border-bottom-color: #3a3a3c; }
html[data-theme="dark"] .nav__list .active { background: #48484a; }

html[data-theme="dark"] .archive__item-title a { color: #f2f2f7; }
html[data-theme="dark"] .archive__item-excerpt { color: #aeaeb2; }
html[data-theme="dark"] .page__meta { color: #8e8e93; }
html[data-theme="dark"] .breadcrumbs ol li a { color: #aeaeb2; }

html[data-theme="dark"] table { background: #2c2c2e; }
html[data-theme="dark"] thead { background: #3a3a3c; color: #f2f2f7; }
html[data-theme="dark"] tr { border-bottom-color: #3a3a3c; }
html[data-theme="dark"] tr:nth-child(even) { background: #2c2c2e; }
html[data-theme="dark"] tr:nth-child(odd) { background: #242426; }
html[data-theme="dark"] th, html[data-theme="dark"] td { border-color: #3a3a3c; }

html[data-theme="dark"] .page__share { border-top-color: #3a3a3c; }
html[data-theme="dark"] .page__comments { border-top-color: #3a3a3c; }
html[data-theme="dark"] .notice { background-color: #2c2c2e; border-left-color: #48484a; }

html[data-theme="dark"] .timeline-list { border-top-color: #3a3a3c; }
html[data-theme="dark"] .timeline-item { border-bottom-color: #3a3a3c; }
html[data-theme="dark"] .timeline-item__date { color: #f0916a; }
html[data-theme="dark"] .timeline-item__tag--paper { color: #f0916a; background: rgba(240, 145, 106, 0.15); }
html[data-theme="dark"] .timeline-item__tag--award { color: #f2b544; background: rgba(242, 181, 68, 0.15); }
html[data-theme="dark"] .timeline-item__tag--milestone { color: #6fc3d6; background: rgba(111, 195, 214, 0.15); }
html[data-theme="dark"] .timeline-item__tag--project { color: #b8b8bd; background: rgba(184, 184, 189, 0.15); }
html[data-theme="dark"] .timeline-scroll { scrollbar-color: #55555a transparent; }
html[data-theme="dark"] .timeline-scroll::-webkit-scrollbar-thumb { background: #55555a; }
html[data-theme="dark"] .timeline-scroll::-webkit-scrollbar-thumb:hover { background: #6a6a70; }
html[data-theme="dark"] .timeline-item__tag--cmu { color: #6fc3d6; background: rgba(111, 195, 214, 0.15); }
html[data-theme="dark"] .timeline-item__tag--cornell { color: #f0916a; background: rgba(240, 145, 106, 0.15); }
</style>
