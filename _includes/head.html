{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>
<script>
  (function() {
    var saved = null;
    var savedPalette = null;
    var savedLightBackground = null;
    var savedDarkBackground = null;

    try {
      saved = localStorage.getItem('theme');
      savedPalette = localStorage.getItem('backgroundPalette');
      savedLightBackground = localStorage.getItem('backgroundLight');
      savedDarkBackground = localStorage.getItem('backgroundDark');
    } catch (e) {}

    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (prefersDark ? 'dark' : 'light');
    var background = theme === 'dark' ? savedDarkBackground : savedLightBackground;

    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-background-palette', savedPalette || 'default');
    document.documentElement.style.setProperty('--site-bg-color', background || (theme === 'dark' ? '#1c1c1e' : '#ffffff'));
    document.documentElement.style.setProperty('background-color', background || (theme === 'dark' ? '#1c1c1e' : '#ffffff'), 'important');
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
{% include dark-mode.html %}

<meta http-equiv="cleartype" content="on">
