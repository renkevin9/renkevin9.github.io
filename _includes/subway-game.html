<aside class="runner" id="runner-window" aria-labelledby="runner-title" hidden>
  <div class="runner__heading"><div><span class="runner__eyebrow">A LITTLE BREAK</span><h2 id="runner-title">Subway dash</h2></div><div class="runner__window-controls"><button type="button" data-runner-width="-1" aria-label="Make game narrower" title="Make narrower">−</button><button type="button" data-runner-width="1" aria-label="Make game wider" title="Make wider">+</button><button type="button" id="runner-close" aria-label="Close game" title="Close">×</button></div></div>
  <div class="runner__screen">
    <canvas id="runner-canvas" width="360" height="480" aria-label="A three-lane endless runner game"></canvas>
    <div class="runner__hud" aria-hidden="true"><span>★ <b id="runner-score">0</b></span><span>● <b id="runner-coins">0</b></span></div>
    <div class="runner__overlay" id="runner-overlay">
      <div class="runner__overlay-content"><span class="runner__overlay-kicker">NEXT STOP: FUN</span><strong id="runner-message">Ready to run?</strong><span id="runner-detail">Dodge trains, jump barriers, and collect coins.</span><button type="button" id="runner-start">Let's go <span aria-hidden="true">→</span></button></div>
    </div>
  </div>
  <div class="runner__controls" aria-label="Game controls"><button type="button" data-runner-action="left" aria-label="Move left">←</button><button type="button" data-runner-action="jump" aria-label="Jump">↑ <span>JUMP</span></button><button type="button" data-runner-action="right" aria-label="Move right">→</button><button type="button" data-runner-action="pause" aria-label="Pause game">Ⅱ</button></div>
  <p class="runner__hint">Use ← → to switch lanes and ↑ or space to jump. Drag the left or bottom edge to resize.</p>
  <div class="runner__resize runner__resize--left" role="separator" tabindex="0" aria-label="Resize game width" aria-orientation="vertical" title="Drag to resize width"></div>
  <div class="runner__resize runner__resize--bottom" role="separator" tabindex="0" aria-label="Resize game height" aria-orientation="horizontal" title="Drag to resize height"></div>
  <div class="runner__resize runner__resize--corner" aria-hidden="true" title="Drag to resize window"></div>
  <p class="runner__status" id="runner-status" role="status" aria-live="polite"></p>
</aside>
<link rel="stylesheet" href="{{ '/assets/css/subway-game.css' | relative_url }}">
<script defer src="{{ '/assets/js/subway-game.js' | relative_url }}"></script>
